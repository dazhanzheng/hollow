[package]
name = "hollow-core"
version = "0.1.0"
edition = "2024"
description = "Core engine for hollow — semantic file ingestion, understanding, and retrieval"

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
rusqlite = { version = "0.39", features = ["bundled"] }
uuid = { version = "1", features = ["v7"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = { version = "0.31", features = ["cli"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
infer = "0.19"
chardetng = "0.1"
zstd = { version = "0.13", default-features = false }
encoding_rs = "0.8.35"
html2text = { version = "0.16", default-features = false }
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.39"
rtf-parser = "0.4"
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic", "ndarray"] }
ndarray = "0.17"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

[build-dependencies]
uniffi = { version = "0.31", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
